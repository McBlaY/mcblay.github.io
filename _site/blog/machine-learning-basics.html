<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Learning Basics</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" disabled>
  <link id="prism-dark" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --bg: #181818;
      --text: #eeeeee;
      --card-bg: #2a2a2a;
      --card-text: #eeeeee;
      --muted: #999999;
      --accent: #1abc9c;
      --section-border: #333;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --text: #222222;
      --card-bg: #e0e0e0;
      --card-text: #222222;
      --muted: #666666;
      --accent: #0e9b78;
      --section-border: #ccc;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.25s, color 0.25s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #theme-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--muted);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 9999;
      transition: background 0.25s, color 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #theme-toggle:hover { opacity: 0.8; }
    pre {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
      margin: 1em 0;
    }
    code {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      background: var(--card-bg);
      color: var(--accent);
      padding: 0.2em 0.4em;
      border-radius: 3px;
    }
    pre code {
      background: none;
      color: inherit;
      padding: 0;
    }
    h1, h2 {
      text-align: center;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid var(--section-border);
      padding: 8px;
    }
    img {
      display: block;
      margin: 0 auto;
    }
    blockquote {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 1em;
      border-left: 4px solid var(--accent);
      margin: 1em 0;
      border-radius: 4px;
    }
    [data-theme="light"] blockquote {
      background: #f9f9f9;
    }
    [data-theme="dark"] blockquote {
      background: #333;
    }
    [data-theme="light"] blockquote {
      background: #f9f9f9;
    }
    [data-theme="dark"] blockquote {
      background: #333;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" title="Toggle light/dark theme"></button>
  <div style="max-width: 980px; margin: 0 auto; padding: 32px 20px; flex: 1;">
    
    <img src="/assets/blog5.jpg" alt="Machine Learning Basics" style="width: 100%; height: 200px; margin-bottom: 20px;">
    
    <p>An introduction to machine learning concepts. Learn the fundamentals and get started. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.</p>

  </div>
  <script>
  (function() {
    var html = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var lightLink = document.getElementById('prism-light');
    var darkLink = document.getElementById('prism-dark');
    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      btn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      if (t === 'dark') {
        lightLink.disabled = true;
        darkLink.disabled = false;
      } else {
        lightLink.disabled = false;
        darkLink.disabled = true;
      }
    }
    applyTheme(localStorage.getItem('theme') || 'dark');
    btn.addEventListener('click', function() {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <footer style="background:var(--card-bg);border-top:1px solid var(--section-border);padding:24px 20px;text-align:center;">
    <div style="max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div style="display:flex;gap:20px;font-size:1.3em;">
        <a href="https://github.com/McBlaY" target="_blank" style="color:var(--muted);text-decoration:none;" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://linkedin.com/in/hoesemicheltornyeviadzi" target="_blank" style="color:var(--muted);text-decoration:none;" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://x.com/tornymichel" target="_blank" style="color:var(--muted);text-decoration:none;" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
      <div style="font-size:0.85em;color:var(--muted);">
        &copy; 2026 Michel Torny &middot;
        <a href="/blog" style="color:var(--muted);text-decoration:none;margin:0 6px;">Blog</a>
        <a href="/research" style="color:var(--muted);text-decoration:none;margin:0 6px;">Research</a>
        <a href="/projects" style="color:var(--muted);text-decoration:none;margin:0 6px;">Projects</a>
        <a href="/about" style="color:var(--muted);text-decoration:none;margin:0 6px;">About</a>
      </div>
    </div>
  </footer>
</body>
</html>
