<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human-Computer Interaction</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" disabled>
  <link id="prism-dark" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --bg: #181818;
      --text: #eeeeee;
      --card-bg: #2a2a2a;
      --card-text: #eeeeee;
      --muted: #999999;
      --accent: #1abc9c;
      --section-border: #333;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --text: #222222;
      --card-bg: #e0e0e0;
      --card-text: #222222;
      --muted: #666666;
      --accent: #0e9b78;
      --section-border: #ccc;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.25s, color 0.25s;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    #theme-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--muted);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.1em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 9999;
      transition: background 0.25s, color 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #theme-toggle:hover { opacity: 0.8; }
    pre {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 0.8em;
      border-radius: 4px;
      overflow-x: auto;
      margin: 1em 0;
      font-size: 10pt;
    }
    pre[class*="language-"] {
      font-size: 10pt;
    }
    code {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      background: var(--card-bg);
      color: var(--accent);
      padding: 0.15em 0.3em;
      border-radius: 3px;
      font-size: 10pt;
    }
    /* Bibliography and References */
    .footnotes, .references, .citations {
      font-size: 10pt;
      line-height: 1.4;
      color: var(--muted);
    }
    .footnote, .reference, .citation {
      font-size: 10pt;
      line-height: 1.4;
      color: var(--muted);
    }
    /* Footnote styling */
    .footnotes ol, .footnotes li {
      font-size: 10pt;
      line-height: 1.4;
      color: var(--muted);
    }
    /* BibTeX and citation blocks */
    pre[class*="bibtex"], pre[class*="citation"] {
      font-size: 10pt;
      line-height: 1.3;
    }
    pre code {
      background: none;
      color: inherit;
      padding: 0;
    }
    /* Copy button styles */
    .copy-container {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: #cccccc;
      padding: 0;
      border-radius: 0;
      cursor: pointer;
      font-size: 16px;
      opacity: 1;
      transition: color 0.2s;
      z-index: 10;
    }
    .copy-container:hover .copy-btn {
      opacity: 1;
    }
    .copy-btn:hover {
      color: var(--accent);
    }
    .copy-btn.copied {
      color: #28a745;
    }
    h1, h2 {
      text-align: center;
    }
    p {
      text-align: justify;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: auto;
    }
    th, td {
      border: 1px solid var(--section-border);
      padding: 8px;
      white-space: nowrap;
    }
    img {
      display: block;
      margin: 0 auto;
    }
    blockquote {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 1em;
      border-left: 4px solid var(--accent);
      margin: 1em 0;
      border-radius: 4px;
      font-size: 10pt;
    }
    [data-theme="light"] blockquote {
      background: #f9f9f9;
    }
    [data-theme="dark"] blockquote {
      background: #333;
    }
    /* Footer responsive */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--section-border);
      padding: 24px 20px;
      text-align: center;
    }
    footer .social-icons {
      display: flex;
      gap: 20px;
      font-size: 1.3em;
      justify-content: center;
      flex-wrap: wrap;
    }
    footer .footer-links {
      display: flex;
      gap: 12px;
      font-size: 0.85em;
      color: var(--muted);
      justify-content: center;
      flex-wrap: wrap;
    }
    @media (max-width: 600px) {
      footer .social-icons {
        gap: 15px;
        font-size: 1.1em;
      }
      footer .footer-links {
        gap: 8px;
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" title="Toggle light/dark theme"></button>
  <div style="max-width: 900px; margin: 0 auto; padding: 32px 20px; flex: 1;">
    
    <img src="/assets/research5.jpg" alt="Human-Computer Interaction" style="width: 100%; height: 200px; margin-bottom: 20px;">
    
    <p>Studies on improving user interfaces and user experience. This includes gesture recognition, voice interfaces, and adaptive systems.</p>

<p>User studies demonstrate improved efficiency and satisfaction with new designs.</p>

    
    <div id="author-info" style="margin-bottom: 20px; color: var(--muted); font-size: 0.9em;">
      By Michel Torny on June 01, 2024
    </div>
    
  </div>
  <script>
  (function() {
    var html = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var lightLink = document.getElementById('prism-light');
    var darkLink = document.getElementById('prism-dark');
    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      btn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      if (t === 'dark') {
        lightLink.disabled = true;
        darkLink.disabled = false;
      } else {
        lightLink.disabled = false;
        darkLink.disabled = true;
      }
    }
    applyTheme(localStorage.getItem('theme') || 'dark');
    btn.addEventListener('click', function() {
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });
  })();
  </script>
  <script>
  // Move author info after the first H1
  document.addEventListener('DOMContentLoaded', function() {
    var authorInfo = document.getElementById('author-info');
    var firstH1 = document.querySelector('h1');
    if (authorInfo && firstH1) {
      firstH1.parentNode.insertBefore(authorInfo, firstH1.nextSibling);
    }
  });
  </script>
  <script>
  // Copy functionality for code blocks only
  document.addEventListener('DOMContentLoaded', function() {
    // Add copy buttons to code blocks
    document.querySelectorAll('pre').forEach(function(pre) {
      if (!pre.parentElement.classList.contains('copy-container')) {
        var container = document.createElement('div');
        container.className = 'copy-container';
        pre.parentElement.insertBefore(container, pre);
        container.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = '<i class="fas fa-copy"></i>';
        btn.title = 'Copy code';
        btn.onclick = function() {
          var code = pre.textContent || pre.innerText;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(function() {
              btn.innerHTML = '<i class="fas fa-check"></i>';
              btn.classList.add('copied');
              setTimeout(function() {
                btn.innerHTML = '<i class="fas fa-copy"></i>';
                btn.classList.remove('copied');
              }, 2000);
            }).catch(function(err) {
              console.error('Clipboard failed, trying fallback: ', err);
              fallbackCopy(code);
            });
          } else {
            fallbackCopy(code);
          }
          function fallbackCopy(text) {
            var textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              btn.innerHTML = '<i class="fas fa-check"></i>';
              btn.classList.add('copied');
              setTimeout(function() {
                btn.innerHTML = '<i class="fas fa-copy"></i>';
                btn.classList.remove('copied');
              }, 2000);
            } catch (err) {
              console.error('Fallback copy failed: ', err);
            }
            document.body.removeChild(textArea);
          }
        };
        container.appendChild(btn);
      }
    });
  });
  </script>
  <footer>
    <div style="max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div class="social-icons">
        <a href="https://github.com/McBlaY" target="_blank" style="color:var(--muted);text-decoration:none;" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://linkedin.com/in/hoesemicheltornyeviadzi" target="_blank" style="color:var(--muted);text-decoration:none;" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://x.com/tornymichel" target="_blank" style="color:var(--muted);text-decoration:none;" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
      <div class="footer-links">
        &copy; 2026 Michel Torny &middot;
        <a href="/blog" style="color:var(--muted);text-decoration:none;">Blog</a>
        <a href="/research" style="color:var(--muted);text-decoration:none;">Research</a>
        <a href="/projects" style="color:var(--muted);text-decoration:none;">Projects</a>
        <a href="/about" style="color:var(--muted);text-decoration:none;">About</a>
      </div>
    </div>
  </footer>
</body>
</html>
